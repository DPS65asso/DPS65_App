<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Arrière-plan sombre arrondi / Shield Base -->
  <path d="M256,40 C170,40 100,70 100,160 C100,280 200,420 256,472 C312,420 412,280 412,160 C412,70 342,40 256,40 Z" 
        fill="url(#shieldGrad)" 
        stroke="#ffffff" 
        stroke-width="12"
        filter="url(#shadow)" />

  <!-- Croix d'urgence blanche avec découpe intérieure -->
  <g transform="translate(156, 130)">
    <!-- Barre Horizontale -->
    <rect x="0" y="70" width="200" height="60" rx="10" fill="url(#redGrad)" stroke="#ffffff" stroke-width="6" />
    <!-- Barre Verticale -->
    <rect x="70" y="0" width="60" height="200" rx="10" fill="url(#redGrad)" stroke="#ffffff" stroke-width="6" />
  </g>

  <!-- Petit contour de rehausse bleu stylisé centré au milieu -->
  <circle cx="256" cy="230" r="32" fill="url(#blueGrad)" stroke="#ffffff" stroke-width="4" />
  
  <!-- Texte DPS65 moderne -->
  <text x="256" y="400" 
        font-family="system-ui, -apple-system, sans-serif" 
        font-weight="900" 
        font-size="62" 
        fill="#ffffff" 
        text-anchor="middle" 
        letter-spacing="2">DPS 65</text>
</svg>
