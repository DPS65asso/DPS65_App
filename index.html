    <meta charset="UTF-8" />

    <meta name="theme-color" content="#f8fafc" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#020617" media="(prefers-color-scheme: dark)">
    
    <!-- iOS support -->

    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <title>DPS65 - Suivi de Victimes</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              primary: {
                50: '#fef2f2',
                100: '#fee2e2',
                200: '#fecaca',
                300: '#fca5a5',
                400: '#f87171',
                500: '#ef4444',
                600: '#dc2626',
                700: '#b91c1c',
                800: '#991b1b',
                900: '#7f1d1d',
              }
            }
          }
        }
      }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Inter', sans-serif;
        -webkit-tap-highlight-color: transparent;
      }
      @keyframes pulse-ring {
        0% { transform: scale(.33); opacity: 1; }
        80%, 100% { opacity: 0; }
      }
      .live-indicator {
        position: relative;
        display: inline-block;
        width: 8px;
        height: 8px;
        background-color: #10b981;
        border-radius: 50%;
      }
      .live-indicator::after {
        content: '';
        position: absolute;
        top: 0; left: 0;
        width: 100%; height: 100%;
        background-color: #10b981;
        border-radius: 50%;
        animation: pulse-ring 1.5s cubic-bezier(0.455, 0.03, 0.515, 0.955) infinite;
      }
      /* Animation pour le mode Urgence */
      @keyframes urgent-pulse {
        0% { background-color: #000; }
        50% { background-color: #991b1b; }
        100% { background-color: #000; }
      }
      .urgent-bg-pulse {
        animation: urgent-pulse 2s infinite;
      }
      /* Animation Heartbeat pour l'icône urgence */
      @keyframes heartbeat {
        0% { transform: scale(1); }
        14% { transform: scale(1.3); }
        28% { transform: scale(1); }
        42% { transform: scale(1.3); }
        70% { transform: scale(1); }
      }
      .animate-heartbeat {
        animation: heartbeat 1.5s infinite;
      }

      /* Leaflet z-index fix for modals */
      .leaflet-pane { z-index: 0 !important; }
      .leaflet-top, .leaflet-bottom { z-index: 1000 !important; }
      
      /* Leaflet Custom DivIcon Fix */
      .custom-div-icon {
        background: transparent !important;
        border: none !important;
      }

      /* Custom Scrollbar for Legend */
      .custom-scrollbar::-webkit-scrollbar {
        width: 4px;
      }
      .custom-scrollbar::-webkit-scrollbar-track {
        background: transparent;
      }
      .custom-scrollbar::-webkit-scrollbar-thumb {
        background: #94a3b8;
        border-radius: 10px;
      }
      .custom-scrollbar::-webkit-scrollbar-thumb:hover {
        background: #64748b;
      }

      /* --- AMÉLIORATION LISIBILITÉ MODE SOMBRE STANDARD --- */
      /* Remplace les couleurs slate-500/600/700 par des équivalents plus clairs en dark mode pour garantir le contraste */
      html.dark:not(.tactical) .text-slate-500 {
          color: #94a3b8 !important; /* slate-400 */
      }
      html.dark:not(.tactical) .text-slate-600 {
          color: #cbd5e1 !important; /* slate-300 */
      }
      html.dark:not(.tactical) .text-slate-700 {
          color: #e2e8f0 !important; /* slate-200 */
      }
      html.dark:not(.tactical) .text-gray-500 { color: #9ca3af !important; }
      html.dark:not(.tactical) .text-gray-600 { color: #d1d5db !important; }
      
      /* Inputs : contraste renforcé */
      html.dark:not(.tactical) input::placeholder,
      html.dark:not(.tactical) textarea::placeholder {
          color: #64748b !important; /* slate-500 (visible sur fond slate-900) */
      }
      html.dark:not(.tactical) input,
      html.dark:not(.tactical) select,
      html.dark:not(.tactical) textarea {
          color: #ffffff !important;
          border-color: #334155 !important; /* slate-700 */
      }

      /* --- MODE TACTIQUE (NUIT/OLED) --- */
      /* Le mode tactique (défini après ultra-eco) prend le dessus pour les couleurs */
      html.tactical body {
        background-color: #000000 !important;
        color: #dc2626 !important; /* Red-600 */
      }
      /* Force tous les arrière-plans en noir ou gris très sombre */
      html.tactical .bg-white, 
      html.tactical .bg-slate-50, 
      html.tactical .bg-slate-100,
      html.tactical .bg-slate-800,
      html.tactical .bg-slate-900,
      html.tactical .bg-slate-950 {
        background-color: #000000 !important;
        border-color: #7f1d1d !important; /* Red-900 */
        color: #ef4444 !important; /* Red-500 */
      }
      /* Force les textes en rouge */
      html.tactical h1, html.tactical h2, html.tactical h3, html.tactical p, html.tactical span, html.tactical div, html.tactical input, html.tactical select, html.tactical button {
        color: #dc2626 !important;
      }
      html.tactical input::placeholder {
        color: #7f1d1d !important;
      }
      /* Bordures rouges */
      html.tactical * {
        border-color: #450a0a !important; /* Red-950 */
      }
      /* Boutons actifs en mode tactique */
      html.tactical button.bg-blue-600, 
      html.tactical button.bg-emerald-600 {
        background-color: #7f1d1d !important; /* Red-900 */
        color: #fca5a5 !important; /* Red-300 */
        border: 1px solid #dc2626 !important;
      }
      
      /* --- FIX BOUTON URGENCE EN MODE TACTIQUE --- */
      html.tactical button.bg-red-600 {
        background-color: #000000 !important;
        border: 3px solid #dc2626 !important;
        color: #ef4444 !important; /* Texte rouge vif */
        box-shadow: 0 0 15px rgba(220, 38, 38, 0.3) !important;
      }
      html.tactical button.bg-red-600 svg {
        stroke: #ef4444 !important;
      }

      /* --- ICONES SVG & LOGO EN MODE TACTIQUE --- */
      html.tactical svg {
        stroke: #dc2626 !important;
      }
      html.tactical svg text,
      html.tactical svg path[fill] {
        fill: #ef4444 !important; /* Red-500 pour meilleur contraste sur noir */
        stroke: none !important; /* Pas de contour sur le texte rempli */
      }
    </style>
